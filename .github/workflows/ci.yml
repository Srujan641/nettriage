name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install network tools
        # dig, ping, openssl and curl ship with the runner image. traceroute is optional:
        # its test skips itself when the tool is missing, so a mirror outage must not fail the build.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends traceroute || echo "traceroute unavailable; its test will be skipped"
      - name: Install package
        working-directory: backend
        run: pip install -e ".[api,dev]"
      - name: Run the tests that need no internet
        working-directory: backend
        run: pytest -m "not network" --cov=nettriage --cov-report=term

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check and build
        working-directory: frontend
        run: npm ci && npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
