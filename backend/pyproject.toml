[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettriage"
version = "1.0.0"
description = "Layered network diagnostics (DNS, ICMP, TCP, TLS, HTTP) with plain-English root-cause reports and packet analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # the engine and CLI are standard-library only

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
nettriage = "nettriage.cli:main"

[tool.setuptools.packages.find]
include = ["nettriage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
filterwarnings = [
    "ignore:ssl.TLSVersion:DeprecationWarning",   # probing legacy TLS versions is this tool's job
    "ignore:Using `httpx`",
]

[tool.ruff]
line-length = 160
target-version = "py310"
